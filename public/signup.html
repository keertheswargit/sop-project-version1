<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hostel - Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SIGNUP CONTAINER -->
    <div id="signup-container" class="auth-container">
        <div class="auth-card">
            <h2>Smart Hostel Portal</h2>
            <p class="subtitle">Student Account Registration</p>

            <form id="signup-form" autocomplete="off">
                <div class="form-group">
                    <label for="reg-username">Student Username / Roll Number</label>
                    <input 
                        type="text" 
                        id="reg-username" 
                        name="username" 
                        placeholder="Enter username or roll number" 
                        required 
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input 
                        type="password" 
                        id="reg-password" 
                        name="password" 
                        placeholder="Enter strong password (min 8 chars)" 
                        required 
                        autocomplete="new-password"
                    >
                    <ul class="password-rules" id="password-rules-list">
                        <li id="rule-len" class="invalid"><span>○</span> At least 8 characters</li>
                        <li id="rule-upper" class="invalid"><span>○</span> At least 1 uppercase letter (A-Z)</li>
                        <li id="rule-lower" class="invalid"><span>○</span> At least 1 lowercase letter (a-z)</li>
                        <li id="rule-num" class="invalid"><span>○</span> At least 1 number (0-9)</li>
                        <li id="rule-special" class="invalid"><span>○</span> At least 1 special character (!@#$%^&*...)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="reg-confirm-password" 
                        name="confirmPassword" 
                        placeholder="Confirm your password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <!-- Inline feedback containers -->
                <div id="signup-error" class="error-msg"></div>
                <div id="signup-success" class="success-msg"></div>

                <button type="submit" id="reg-submit-btn" class="submit-btn">Register Account</button>
            </form>

            <div class="auth-link-container">
                <p>Already have an account? <a href="/index.html" class="auth-link">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
